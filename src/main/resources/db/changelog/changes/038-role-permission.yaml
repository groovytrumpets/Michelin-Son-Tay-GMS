            comment: MANAGER — toàn bộ trừ nhật ký hệ thống, log backend, báo lỗi và chính màn phân quyền
            sql: >-
              INSERT INTO role_permission (role_id, permission_code)
              SELECT r.role_id, p.code
              FROM role r CROSS JOIN permission p
              WHERE r.role_code = 'MANAGER'
                AND p.module_code NOT IN ('SYSTEM_LOG','BACKEND_LOG','BUG_REPORT','ROLE_PERMISSION')

