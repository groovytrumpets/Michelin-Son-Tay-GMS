# Phân quyền động: tách "quyền" ra khỏi "vai trò".
#
# Trước đây quyền nằm cứng trong code — @PreAuthorize("hasAnyRole('MANAGER','ADMIN')")
# ở backend và mảng roles: [...] trong SideBar.jsx/App.jsx ở frontend. Muốn cho
# một vai trò chỉ-đọc một màn hình nào đó thì phải sửa code và build lại.
#
# Kể từ changeset này:
#   - permission        = DANH MỤC MÃ QUYỀN, cố định theo code. Chỉ seed ở đây,
#                         không có màn thêm/xoá. Lý do: code phải kiểm tra theo
#                         một cái tên có sẵn, admin tự đặt tên mới thì không có
#                         chỗ nào kiểm tra nó cả.
#   - role_permission   = VAI TRÒ CÓ NHỮNG QUYỀN NÀO. Đây mới là phần động,
#                         admin chỉnh được ở màn /role-permission-config.
#
# ADMIN cố ý KHÔNG có dòng nào trong role_permission: quyền của ADMIN được suy ra
# trong code là "tất cả" (PermissionResolver). Nhờ vậy thêm mã quyền mới về sau
# không bao giờ khoá mất chính người đang cấu hình.
#
# Bộ quyền mặc định bên dưới = HỢP của những gì hôm nay đã cho phép: sidebar FE
# cho thấy gì, và @PreAuthorize BE cho gọi gì. Lấy hợp chứ không lấy giao để
# không vai trò nào mất quyền đang dùng sau khi nâng cấp. Chỗ nào rộng hơn mong
# muốn thì bỏ tick trong màn cấu hình, không cần sửa code.
databaseChangeLog:
  - changeSet:
      id: 038-1-permission-catalog
      author: gms
      comment: Bảng danh mục mã quyền — cố định theo code, seed sẵn, không cho thêm/xoá qua UI
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: permission
      changes:
        - createTable:
            tableName: permission
            remarks: Danh mục mã quyền cố định; code phải khớp hằng số trong PermissionCodes.java
            columns:
              - column:
                  name: code
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: Mã quyền dùng trong @PreAuthorize("hasAuthority('...')") và can() ở FE
              - column:
                  name: module_code
                  type: VARCHAR(48)
                  constraints:
                    nullable: false
                  remarks: Nhóm chức năng — một hàng trong ma trận phân quyền
              - column:
                  name: module_label
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: group_label
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                  remarks: Nhóm lớn để gom hàng trong ma trận, đặt trùng tên nhóm ở sidebar
              - column:
                  name: action_code
                  type: VARCHAR(24)
                  constraints:
                    nullable: false
                  remarks: VIEW / CREATE / EDIT / DELETE / và vài hành động riêng như APPROVE, PAYMENT
              - column:
                  name: label
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
                  remarks: Nhãn ngắn của hành động, hiện ở đầu cột ma trận
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: sort_order
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createIndex:
            tableName: permission
            indexName: idx_permission_module
            columns:
              - column:
                  name: module_code
              - column:
                  name: sort_order
      rollback:
        - dropTable:
            tableName: permission

  - changeSet:
      id: 038-2-role-permission
      author: gms
      comment: Bảng nối vai trò với quyền — phần duy nhất admin được sửa
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: role_permission
      changes:
        - createTable:
            tableName: role_permission
            remarks: Vai trò nào có quyền nào; ADMIN không lưu ở đây vì luôn được suy ra là toàn quyền
            columns:
              - column:
                  name: role_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: permission_code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: role_permission
            columnNames: role_id, permission_code
            constraintName: pk_role_permission
        - addForeignKeyConstraint:
            baseTableName: role_permission
            baseColumnNames: role_id
            referencedTableName: role
            referencedColumnNames: role_id
            constraintName: fk_role_permission_role
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: role_permission
            baseColumnNames: permission_code
            referencedTableName: permission
            referencedColumnNames: code
            constraintName: fk_role_permission_permission
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: role_permission

  - changeSet:
      id: 038-3-role-metadata
      author: gms
      comment: Đánh dấu vai trò hệ thống để UI không cho xoá, và thêm chỗ mô tả vai trò tự tạo
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: role
                columnName: is_system
      changes:
        - addColumn:
            tableName: role
            columns:
              - column:
                  name: is_system
                  type: TINYINT(1)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: Vai trò gốc của hệ thống — code nghiệp vụ tra cứu theo role_code nên không được xoá/đổi mã
              - column:
                  name: description
                  type: VARCHAR(255)
        # TECHNICIAN/ADVISOR còn được dùng làm dữ liệu nghiệp vụ, không chỉ để phân
        # quyền: TicketAssignmentService, CheckInService, TicketBackfillService tra
        # "ai là KTV", "ai là cố vấn" theo đúng mã này. Xoá hoặc đổi mã là hỏng việc
        # gán phiếu, nên khoá lại ngay từ dữ liệu.
        - sql:
            comment: Các vai trò đang có đều là vai trò gốc
            sql: >-
              UPDATE role SET is_system = 1
              WHERE role_code IN ('ADMIN','MANAGER','ADVISOR','RECEPTIONIST','TECHNICIAN',
                                  'WAREHOUSE_KEEPER','WAREHOUSE_MANAGER','ACCOUNTANT','CUSTOMER')
      rollback:
        - dropColumn:
            tableName: role
            columnName: is_system
        - dropColumn:
            tableName: role
            columnName: description

