      author: gms
      comment: Bộ quyền mặc định của từng vai trò — dựng lại đúng những gì code đang cho phép hôm nay
      # Bản đầu của changeset này có cấp thêm SERVICE_TICKET_ASSIGN cho lễ tân,
      # và đã kịp chạy trên máy dev trước khi bị sửa lại. Giữ checksum cũ ở đây
      # để DB đó vẫn khởi động được; phần sửa nằm ở changeset 038-7 bên dưới.
      validCheckSum:
        - 9:79c0c696e593e3fcff799656905f5ec3
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT COUNT(*) FROM role_permission
      changes:
        # MANAGER viết theo kiểu loại trừ cho gọn: quản lý đang đụng gần hết hệ
        # thống, chỉ trừ mấy màn dành riêng cho ADMIN.
