# Xuất báo cáo tổng hợp (/report-export, nhóm "Báo cáo").
#
# Một file Excel nhiều tab: danh bạ khách + xe, doanh thu sản phẩm, tồn kho, phiếu dịch vụ + chi
# tiết hạng mục (+ sổ dịch vụ cũ), biên lợi nhuận. Trước khi tải phải nhập mã 6 số gửi về email
# của chính tài khoản (DataExportVerificationService — giữ trong RAM, không có bảng mới).
#
# Chỉ thêm mã quyền REPORT_DATA_EXPORT. Cấp mặc định cho MANAGER (ADMIN luôn có mọi quyền) vì
# file chứa toàn bộ thông tin khách và giá vốn / lợi nhuận; vai trò khác (VD kế toán) thì Admin
# tự tick ở /role-permission-config.
databaseChangeLog:
  - changeSet:
      id: 057-1-permission-report-data-export
      author: gms
      comment: Mã quyền "Xuất báo cáo tổng hợp", cấp mặc định cho MANAGER
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT COUNT(*) FROM permission WHERE code = 'REPORT_DATA_EXPORT'
      changes:
        - sql:
            splitStatements: false
            sql: >-
              INSERT INTO permission (code, module_code, module_label, group_label, action_code, label, description, sort_order) VALUES
              ('REPORT_DATA_EXPORT','REPORT_EXPORT','Xuất báo cáo tổng hợp','Báo cáo & Tài chính','EXPORT','Xuất file','Mở /report-export và tải file Excel gồm toàn bộ thông tin khách hàng, doanh thu sản phẩm, tồn kho, phiếu dịch vụ và biên lợi nhuận. Mỗi lần xuất phải nhập mã gửi về email của tài khoản',741)
        - sql:
            comment: Cấp cho MANAGER ở bộ quyền đang dùng
            splitStatements: false
            sql: >-
              INSERT INTO role_permission (role_id, permission_code)
              SELECT r.role_id, 'REPORT_DATA_EXPORT'
              FROM role r
              WHERE r.role_code = 'MANAGER'
                AND NOT EXISTS (
                  SELECT 1 FROM role_permission rp
                  WHERE rp.role_id = r.role_id AND rp.permission_code = 'REPORT_DATA_EXPORT'
                )
        - sql:
            comment: Và ở bộ mặc định để "Khôi phục mặc định" không nuốt mất
            splitStatements: false
            sql: >-
              INSERT INTO role_permission_default (role_id, permission_code)
              SELECT r.role_id, 'REPORT_DATA_EXPORT'
              FROM role r
              WHERE r.role_code = 'MANAGER'
                AND NOT EXISTS (
                  SELECT 1 FROM role_permission_default rpd
                  WHERE rpd.role_id = r.role_id AND rpd.permission_code = 'REPORT_DATA_EXPORT'
                )
      rollback:
        - sql: "DELETE FROM role_permission WHERE permission_code = 'REPORT_DATA_EXPORT'"
        - sql: "DELETE FROM role_permission_default WHERE permission_code = 'REPORT_DATA_EXPORT'"
        - sql: "DELETE FROM permission WHERE code = 'REPORT_DATA_EXPORT'"
