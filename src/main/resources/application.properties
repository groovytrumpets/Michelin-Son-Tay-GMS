spring.application.name=MST-GMS

# ================= DATABASE =================
spring.datasource.url=${URL_DB}
spring.datasource.username=${USERNAME_DB}
spring.datasource.password=${PASSWORD_DB}

# ================= DATABASE MIGRATION (Liquibase) =================
# Chạy tự động lúc khởi động, trước khi JPA kiểm tra entity.
# Thêm thay đổi schema: xem docs/DATABASE_MIGRATION.md
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# Giữ ddl-auto=none: schema do Liquibase quản lý, Hibernate không được tự sửa.

# ================= JPA =================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# ================= JWT =================
jwt.secret=QWERTYuiopASDFGHjklZXCVBNM1234567890qwertyuiopasdfghjklzxcvbnm==
jwt.expirationMs=3600000000

# ================= Oauth2 =================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# ================= Cloudinary =================
api-secret= ${Cloudinary_API_SECRET}
api-key= ${Cloudinary_API_KEY}
cloud-name= ${Cloudinary_CLOUD_NAME}

# ================= GEMINI AI =================
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=gemini-3.5-flash
gemini.api.fallback-models=gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3-flash,gemini-2.5-flash-lite,gemini-2.0-flash,gemini-1.5-flash
# Ngưỡng quota hiển thị cho người dùng (đếm nội bộ, in-memory) — KHÔNG PHẢI số quota
# thật Google còn cấp cho API key (Gemini free tier không có API tra cứu quota còn lại).
# Chỉnh theo gói Gemini đang dùng, mặc định là ước lượng an toàn cho free tier.
gemini.quota.daily-token-limit=1000000
gemini.quota.daily-request-limit=1500
# ================= LOG =================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

#================== Nginx =============
server.forward-headers-strategy=framework

# ================= TIN TỨC / BLOG =================
# Tên miền trang khách — dùng để dựng URL tuyệt đối trong thẻ og:url, canonical
# và sitemap. Sai giá trị này thì link chia sẻ lên Facebook/Zalo sẽ trỏ nhầm.
news.site.url=${NEWS_SITE_URL:https://sontaygarage.vn}
news.api.url=${NEWS_API_URL:https://api.sontaygarage.vn}
news.site.name=Michelin Sơn Tây
news.site.logo=${NEWS_SITE_LOGO:https://sontaygarage.vn/Copy%20of%20Logo.png}
# Muối băm danh tính người xem (IP + User-Agent) để đếm view mà không lưu IP thô.
news.view.salt=${NEWS_VIEW_SALT:mst-gms-news}

#================== Zalo =============
zalo.app-id=1162973287649757116
zalo.secret-key=7WM33RTRU8KcCX22bQmj
#==================File size max==============single file and all file=====
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=300MB

# Hikvision Device Configuration
hikvision.device.host=${HIKVISION_HOST}
hikvision.device.port=${HIKVISION_PORT}
hikvision.device.username=${HIKVISION_USERNAME}
hikvision.device.password=${HIKVISION_PASSWORD}
hikvision.device.sync-enabled=true
hikvision.device.connect-timeout-seconds=10
hikvision.device.socket-timeout-seconds=10

# Hikvision Mock Server (for development)
hikvision.mock.enabled=false

# ================= WEB PUSH (VAPID) =================
# Sinh cặp khoá 1 lần: `npx web-push generate-vapid-keys`
# - Public Key: dán vào FE (VITE_VAPID_PUBLIC_KEY) VÀ vapid.public-key dưới đây
# - Private Key: chỉ để ở backend (vapid.private-key)
# Thiếu khoá -> tính năng Web Push tự tắt (chỉ còn STOMP khi web đang mở).
vapid.public-key=${VAPID_PUBLIC_KEY}
vapid.private-key=${VAPID_PRIVATE_KEY}
vapid.subject=${VAPID_SUBJECT:mailto:admin@sontaygarage.vn}

# ================= EMAIL NOTIFICATION (SMTP) =================
# Kênh gửi thông báo thay thế cho Zalo ZNS — khách hàng chọn Zalo hoặc Email trong hồ sơ.
# Thiếu notification.email.host -> tính năng gửi email tự tắt (chỉ còn Zalo), xem EmailNotificationSender.
#
# LƯU Ý khi dùng Gmail:
# - MẬT KHẨU phải là App Password 16 ký tự (Google hiển thị thành 4 nhóm 4 ký tự),
#   nhập LIỀN không dấu cách. Mật khẩu Gmail thường KHÔNG dùng được.
# - notification.email.from BẮT BUỘC trùng với notification.email.username. Gmail không
#   cho gửi thư mang địa chỉ người gửi khác (trừ khi đã verify alias trong Gmail).
#   Muốn hiện no-reply@sontaygarage.vn thì phải dùng SMTP của chính tên miền đó
#   (hoặc dịch vụ như Brevo/SendGrid đã verify domain), không dùng được Gmail.
# - Đổi các giá trị này XONG phải KHỞI ĐỘNG LẠI ứng dụng thì mới có hiệu lực.
#
# MẬT KHẨU KHÔNG ĐƯỢC ĐẶT MẶC ĐỊNH TRONG FILE NÀY — file đang được git theo dõi,
# viết thẳng vào đây là đẩy mật khẩu lên repo. Đặt ở biến môi trường như các khoá bí
# mật khác trong file (URL_DB, GEMINI_API_KEY...).
notification.email.host=${MAIL_SMTP_HOST:smtp.gmail.com}
notification.email.port=${MAIL_SMTP_PORT:587}
notification.email.username=${MAIL_SMTP_USERNAME:}
notification.email.password=${MAIL_SMTP_PASSWORD:}
notification.email.from=${MAIL_FROM_ADDRESS:}
notification.email.from-name=${MAIL_FROM_NAME:Michelin Sơn Tây}
spring.mail.host=${notification.email.host}
spring.mail.port=${notification.email.port}
spring.mail.username=${notification.email.username}
spring.mail.password=${notification.email.password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
